[pytest]
# ---------------------------------------------------------------------------
# pytest 配置：图书管理系统接口自动化测试
# ---------------------------------------------------------------------------
# 用例文件与函数命名
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试根目录（保证 conftest 与 book_api_test 包能被正确导入）
testpaths = tests

# 基础参数：-v 显示用例名，-ra 汇总非通过用例原因
addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --color=yes

# 自定义标记
markers =
    smoke: 冒烟用例（核心链路，快速反馈）
    regression: 回归用例（覆盖全部功能）
    defect: 用于暴露已知缺陷的用例（预期会失败，见 sut/KNOWN_DEFECTS.md）

# 日志
log_cli = false
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

# 超时保护（需 pytest-timeout；未安装时该行会被忽略）
# timeout = 120
